<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | STADENCHAT</title>

    <meta name="description" content="Create your STADENCHAT account and start connecting with people and communities.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #111111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 460px;
        }

        .register-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 38px 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            border: 0.5cm solid #1877F2;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area img {
            width: 210px;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .heading h1 {
            font-size: 30px;
            font-weight: 800;
            color: #111111;
            margin-bottom: 8px;
        }

        .heading p {
            font-size: 15px;
            color: #666666;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #d5d5d5;
            border-radius: 10px;
            font-size: 15px;
            color: #111111;
            background: #ffffff;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #1877F2;
            box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.10);
        }

        .create-btn {
            width: 100%;
            height: 52px;
            margin-top: 7px;
            border: none;
            border-radius: 10px;
            background: #1877F2;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .create-btn:hover {
            background: #0d6be0;
        }

        .login-area {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #666666;
        }

        .login-area a {
            color: #1877F2;
            text-decoration: none;
            font-weight: 700;
        }

        .login-area a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #111111;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-home a:hover {
            color: #1877F2;
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 15px;
            }

            .register-card {
                padding: 30px 22px;
                border-radius: 15px;
            }

            .logo-area img {
                width: 185px;
            }

            .heading h1 {
                font-size: 26px;
            }

            .heading p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo-area">
                <img src="stadenchat-logo.png" alt="STADENCHAT Logo">
            </div>

            <div class="heading">
                <h1>Create Your Account</h1>
                <p>Join STADENCHAT and start connecting with people and communities.</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit" class="create-btn">
                    Create Account
                </button>

            </form>

            <div class="login-area">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

        <div class="back-home">
            <a href="index.html">← Back to STADENCHAT</a>
        </div>

    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            alert("Account registration will be connected to the STADENCHAT backend next.");
        });
    </script>

</body>
</html>
